name: CyberToolkit Pro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyYAML pytest pytest-cov

    - name: Run tests
      shell: bash
      run: |
        pytest tests/ -v --tb=short -x

    - name: Verify tool loading
      run: |
        python -c "from core.loader import load_all; from core.registry import get_registry; load_all(quiet=True); r = get_registry(); print(f'Tools loaded: {len(r.search(\"\"))}')"

    - name: Verify CLI help
      run: |
        python main.py --help

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install PyYAML pyflakes

    - name: Check for syntax errors
      run: |
        python -m py_compile main.py
        find core/ -name "*.py" -exec python -m py_compile {} \;
        find modules/ -name "*.py" -exec python -m py_compile {} \;
