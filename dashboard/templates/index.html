<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberToolkit Pro — Dashboard</title>
<style>
  :root {
    --bg: #0a0e1a; --surface: #111827; --surface2: #1a2236;
    --text: #e2e8f0; --text-dim: #64748b; --accent: #38bdf8;
    --accent2: #818cf8; --border: #1e293b; --success: #22c55e;
    --warning: #eab308; --danger: #ef4444; --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }

  /* --- Header --- */
  .header {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    border-bottom: 1px solid var(--border); padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 1.3rem; color: var(--accent); }
  .header h1 span { color: var(--accent2); }
  .header .status { font-size: 0.8rem; color: var(--success); }
  .header .status::before { content: "●"; margin-right: 0.3rem; }

  /* --- Layout --- */
  .container { display: flex; height: calc(100vh - 56px); }
  .sidebar {
    width: 280px; background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0;
  }
  .main { flex: 1; overflow-y: auto; padding: 1.5rem; }

  /* --- Sidebar --- */
  .sidebar-section { padding: 0.5rem 0; }
  .sidebar-title {
    padding: 0.5rem 1rem; font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--text-dim); font-weight: 600;
  }
  .category-btn {
    display: flex; align-items: center; gap: 0.5rem; width: 100%;
    padding: 0.6rem 1rem; border: none; background: none; color: var(--text);
    cursor: pointer; font-size: 0.85rem; text-align: left; transition: all 0.15s;
  }
  .category-btn:hover { background: var(--surface2); }
  .category-btn.active { background: var(--surface2); color: var(--accent); border-left: 3px solid var(--accent); }
  .category-icon { font-size: 1rem; width: 24px; text-align: center; }
  .category-count {
    margin-left: auto; background: var(--surface2); padding: 0.1rem 0.5rem;
    border-radius: 10px; font-size: 0.7rem; color: var(--text-dim);
  }

  /* --- Tool Cards --- */
  .tool-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1rem;
  }
  .tool-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.2rem; cursor: pointer; transition: all 0.2s;
  }
  .tool-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(56,189,248,0.1); }
  .tool-card h3 { font-size: 0.95rem; color: var(--accent); margin-bottom: 0.3rem; }
  .tool-card p { font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; }
  .tool-card .path { font-size: 0.7rem; color: var(--accent2); font-family: monospace; margin-top: 0.5rem; }

  /* --- Run Panel --- */
  .run-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem;
    display: none;
  }
  .run-panel.active { display: block; }
  .run-panel h2 { color: var(--accent); font-size: 1.1rem; margin-bottom: 1rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label {
    display: block; font-size: 0.8rem; color: var(--text-dim);
    margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .form-group input {
    width: 100%; padding: 0.6rem 0.8rem; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 0.9rem; outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--accent); }
  .btn {
    padding: 0.6rem 1.5rem; border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.85rem; font-weight: 600; transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #0f172a; }
  .btn-primary:hover { background: #7dd3fc; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }

  /* --- Results --- */
  .results {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.5rem; display: none;
  }
  .results.active { display: block; }
  .results h2 { color: var(--accent); font-size: 1.1rem; margin-bottom: 1rem; }
  .results pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 1rem; font-size: 0.8rem; overflow-x: auto; max-height: 500px;
    overflow-y: auto; color: #a5f3fc; font-family: 'Cascadia Code', 'Fira Code', monospace;
  }
  .finding {
    padding: 0.6rem; margin-bottom: 0.5rem; border-radius: 6px;
    border-left: 3px solid var(--warning); background: rgba(234,179,8,0.05);
  }
  .finding.critical { border-color: var(--danger); background: rgba(239,68,68,0.05); }
  .finding.high { border-color: #f97316; background: rgba(249,115,22,0.05); }
  .finding .title { font-weight: 600; font-size: 0.85rem; }
  .finding .desc { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.2rem; }

  .stat-bar {
    display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;
  }
  .stat {
    background: var(--bg); padding: 0.5rem 1rem; border-radius: 6px;
    border: 1px solid var(--border);
  }
  .stat .num { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
  .stat .label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }

  .loading { display: none; text-align: center; padding: 2rem; color: var(--text-dim); }
  .loading.active { display: block; }
  .spinner {
    display: inline-block; width: 30px; height: 30px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search-box {
    padding: 0.5rem 1rem; margin: 0.5rem; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 0.85rem; width: calc(100% - 1rem); outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <h1>⬡ Cyber<span>Toolkit</span> Pro</h1>
  <div class="status" id="status">Loading...</div>
</div>

<div class="container">
  <div class="sidebar">
    <input type="text" class="search-box" placeholder="Search tools..." id="searchBox" oninput="filterTools()">
    <div class="sidebar-section" id="categoryList"></div>
  </div>

  <div class="main">
    <div class="run-panel" id="runPanel">
      <h2 id="toolTitle"></h2>
      <p id="toolDesc" style="color: var(--text-dim); font-size: 0.85rem; margin-bottom: 1rem;"></p>
      <div id="argsForm"></div>
      <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
        <button class="btn btn-primary" onclick="runTool()">▶ Execute</button>
        <button class="btn btn-secondary" onclick="closePanel()">Cancel</button>
      </div>
    </div>

    <div class="loading" id="loading"><div class="spinner"></div><p style="margin-top:0.5rem">Executing...</p></div>

    <div class="results" id="resultsPanel">
      <h2>Results</h2>
      <div class="stat-bar" id="statBar"></div>
      <div id="findingsContainer"></div>
      <pre id="resultsJson"></pre>
    </div>

    <div class="tool-grid" id="toolGrid"></div>
  </div>
</div>

<script>
let allTools = {};
let currentTool = null;

async function init() {
  try {
    const statusResp = await fetch('/api/status');
    const statusData = await statusResp.json();
    document.getElementById('status').textContent = `${statusData.tools_loaded} tools loaded`;

    const resp = await fetch('/api/tools');
    const data = await resp.json();
    allTools = data.tools;
    renderCategories();
    showAllTools();
  } catch (e) {
    document.getElementById('status').textContent = 'Connection error';
    document.getElementById('status').style.color = 'var(--danger)';
  }
}

const ICONS = {
  reconnaissance: '🔍', scanning: '📡', web: '🌐', exploitation: '💣',
  passwords: '🔑', detection: '🛡️', log_analysis: '📋', forensics: '🔬',
  siem: '📊', reporting: '📝'
};

function renderCategories() {
  const el = document.getElementById('categoryList');
  let html = '<div class="sidebar-title">Categories</div>';
  html += `<button class="category-btn active" onclick="showAllTools(this)">
    <span class="category-icon">📦</span>All Tools
    <span class="category-count">${Object.values(allTools).flat().length}</span>
  </button>`;
  for (const [cat, tools] of Object.entries(allTools)) {
    html += `<button class="category-btn" onclick="showCategory('${cat}', this)">
      <span class="category-icon">${ICONS[cat] || '🔧'}</span>${cat}
      <span class="category-count">${tools.length}</span>
    </button>`;
  }
  el.innerHTML = html;
}

function showAllTools(btn) {
  setActiveBtn(btn);
  const grid = document.getElementById('toolGrid');
  let html = '';
  for (const [cat, tools] of Object.entries(allTools)) {
    tools.forEach(t => { html += toolCard(t); });
  }
  grid.innerHTML = html;
}

function showCategory(cat, btn) {
  setActiveBtn(btn);
  const grid = document.getElementById('toolGrid');
  const tools = allTools[cat] || [];
  grid.innerHTML = tools.map(t => toolCard(t)).join('');
}

function toolCard(t) {
  return `<div class="tool-card" onclick="selectTool('${t.path}')">
    <h3>${ICONS[t.category] || ''} ${t.name}</h3>
    <p>${t.description}</p>
    <div class="path">${t.path}</div>
  </div>`;
}

function setActiveBtn(btn) {
  if (!btn) return;
  document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function selectTool(path) {
  const tools = Object.values(allTools).flat();
  currentTool = tools.find(t => t.path === path);
  if (!currentTool) return;

  document.getElementById('toolTitle').textContent = `${currentTool.name}`;
  document.getElementById('toolDesc').textContent = currentTool.description;

  let form = '';
  (currentTool.args || []).forEach(a => {
    form += `<div class="form-group">
      <label>${a.name}${a.required ? ' *' : ''} ${a.description ? '— ' + a.description : ''}</label>
      <input type="text" id="arg_${a.name}" value="${a.default || ''}" placeholder="${a.name}">
    </div>`;
  });
  if (!currentTool.args || currentTool.args.length === 0) {
    form = `<div class="form-group"><label>Target</label>
      <input type="text" id="arg_target" placeholder="Target IP or hostname"></div>`;
  }
  document.getElementById('argsForm').innerHTML = form;
  document.getElementById('runPanel').classList.add('active');
  document.getElementById('resultsPanel').classList.remove('active');
}

async function runTool() {
  if (!currentTool) return;
  const args = {};
  (currentTool.args || []).forEach(a => {
    const el = document.getElementById(`arg_${a.name}`);
    if (el && el.value) args[a.name] = el.value;
  });
  // Fallback target
  const targetEl = document.getElementById('arg_target');
  if (targetEl && targetEl.value && !args.target) args.target = targetEl.value;

  document.getElementById('loading').classList.add('active');
  document.getElementById('resultsPanel').classList.remove('active');

  try {
    const resp = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tool_path: currentTool.path, args })
    });
    const data = await resp.json();
    showResults(data);
  } catch (e) {
    showResults({ status: 'error', error: e.message });
  }
  document.getElementById('loading').classList.remove('active');
}

function showResults(data) {
  document.getElementById('resultsPanel').classList.add('active');

  // Stats
  const findings = data.findings || [];
  document.getElementById('statBar').innerHTML = `
    <div class="stat"><div class="num">${data.status || 'N/A'}</div><div class="label">Status</div></div>
    <div class="stat"><div class="num">${findings.length}</div><div class="label">Findings</div></div>
    <div class="stat"><div class="num">${(data.duration_ms || 0).toFixed(0)}ms</div><div class="label">Duration</div></div>
  `;

  // Findings
  let fhtml = '';
  findings.forEach(f => {
    const sev = f.severity || 'info';
    const cls = (sev === 'critical' || sev === 'high') ? sev : '';
    fhtml += `<div class="finding ${cls}">
      <div class="title">[${sev.toUpperCase()}] ${f.title || ''}</div>
      <div class="desc">${f.description || ''}</div>
    </div>`;
  });
  document.getElementById('findingsContainer').innerHTML = fhtml;

  // JSON
  document.getElementById('resultsJson').textContent = JSON.stringify(data, null, 2);
}

function closePanel() {
  document.getElementById('runPanel').classList.remove('active');
  currentTool = null;
}

function filterTools() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const grid = document.getElementById('toolGrid');
  const all = Object.values(allTools).flat();
  const filtered = all.filter(t =>
    t.name.toLowerCase().includes(q) ||
    t.description.toLowerCase().includes(q) ||
    t.path.toLowerCase().includes(q)
  );
  grid.innerHTML = filtered.map(t => toolCard(t)).join('');
}

init();
</script>
</body>
</html>
